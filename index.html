<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sekibar AI</title>
<link rel="icon" href="icons/favicon-32.png">
<link rel="stylesheet" href="ai.css">
</head>
<body>
  <section id="login" class="login" hidden>
    <form id="loginForm" class="card">
      <h1>Sekibar AI</h1>
      <p class="muted">Log in om te chatten.</p>
      <input id="email" type="email" placeholder="E-mailadres" required autocomplete="email">
      <input id="password" type="password" placeholder="Wachtwoord" required autocomplete="current-password" minlength="6">
      <button type="submit">Inloggen</button>
      <button type="button" id="signup" class="link">Nog geen account? Registreren</button>
      <p id="loginMsg" class="msg" role="status"></p>
    </form>
  </section>

  <section id="app" class="app" hidden>
    <aside class="side">
      <button id="newChat">+ Nieuw gesprek</button>
      <ul id="convList"></ul>
      <button id="logout" class="link">Uitloggen</button>
    </aside>
    <main class="chat">
      <div id="messages" class="messages" aria-live="polite"></div>
      <form id="chatForm" class="composer">
        <textarea id="input" rows="1" placeholder="Stel een vraag…" required maxlength="8000"></textarea>
        <button type="submit" id="send">Verstuur</button>
      </form>
    </main>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="ai.js"></script>
</body>
</html>
