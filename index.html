<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECO</title>
<link rel="icon" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ECO">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14161c">
<link rel="stylesheet" href="ai.css">
</head>
<body>
  <div id="version" class="version" title="Laatst bijgewerkte pull request">PR57 | 28-10-2026 19:35</div>
  <section id="login" class="login" hidden>
    <form id="loginForm" class="card">
      <h1>E.C.O.</h1>
      <p class="muted">Identificeer jezelf.</p>
      <input id="email" type="email" placeholder="E-mailadres" required autocomplete="email">
      <input id="password" type="password" placeholder="Wachtwoord" required autocomplete="current-password" minlength="6">
      <button type="submit">Inloggen</button>
      <p id="loginMsg" class="msg" role="status"></p>
    </form>
  </section>

  <section id="app" class="app" hidden>
    <aside class="side">
      <div class="orb" id="orb"></div>
      <button id="newChat">+ Nieuw gesprek</button>
      <label class="muted"><input type="checkbox" id="speak" checked> Antwoorden voorlezen</label>
      <ul id="convList"></ul>
      <button id="logout" class="link">Uitloggen</button>
    </aside>
    <main class="chat">
      <div id="messages" class="messages" aria-live="polite"></div>
      <form id="chatForm" class="composer">
        <button type="button" id="mic" title="Spreek (spatie ingedrukt houden)" aria-label="Spreek">🎙️</button>
        <textarea id="input" rows="1" placeholder="Zeg of typ iets, Serkan…" required maxlength="8000"></textarea>
        <button type="submit" id="send">Verstuur</button>
      </form>
    </main>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="ai.js"></script>
</body>
</html>
