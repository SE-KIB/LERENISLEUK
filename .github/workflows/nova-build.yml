name: NOVA bouwen (Windows)

# Bouwt NOVA.exe (ECO op je Windows-laptop, zie NOVA.md) bij elke wijziging in nova/, test hem op een echte Windows-machine
# en zet hem als download klaar: https://github.com/SE-KIB/LERENISLEUK/releases/latest/download/NOVA.exe
# In de exe zit geen enkele sleutel; de ECO-sleutel vul je zelf in bij de eerste start.

on:
  push:
    branches: [main]
    paths: ["nova/**", ".github/workflows/nova-build.yml"]
  pull_request:
    paths: ["nova/**", ".github/workflows/nova-build.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nova-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bouwen:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Pakketten installeren
        run: |
          python -m pip install --upgrade pip
          pip install -r nova/requirements.txt pyinstaller==6.11.1
      - name: Tests (op Windows)
        working-directory: nova
        run: python -m unittest -v test_nova
      - name: NOVA.exe bouwen (met ECO's opmaak)
        working-directory: nova
        run: |
          Copy-Item ..\ai.css ui\ai.css
          Set-Content ui\build.txt "${{ github.run_number }}"  # NOVA vergelijkt dit nummer om zichzelf bij te werken
          # Piper (Nederlandse stem): alleen de uitspraakregels van espeak-ng mee, niet de Arabische/Hebreeuwse modellen
          $piper = python -c "import os, piper; print(os.path.dirname(piper.__file__))"
          pyinstaller --noconfirm --onefile --windowed --name NOVA --add-data "ui;ui" --add-data "$piper\espeak-ng-data;piper\espeak-ng-data" --hidden-import piper.espeakbridge --collect-binaries onnxruntime --collect-data docx --collect-data pptx --collect-all vosk --collect-all sounddevice --hidden-import clr --hidden-import pyttsx3.drivers --hidden-import pyttsx3.drivers.sapi5 --hidden-import comtypes.stream nova.py
          "NOVA.exe: {0:N0} MB" -f ((Get-Item dist\NOVA.exe).Length / 1MB)
      - name: Zelftest van de exe
        shell: pwsh
        run: |
          # De Nederlandse stem alvast neerzetten (zoals NOVA zelf doet als hij online is), zodat de zelftest echt een zin maakt
          $stem = "$env:APPDATA\NOVA\stem"
          New-Item -ItemType Directory -Force $stem | Out-Null
          foreach ($ext in ".onnx.json", ".onnx") {
            Invoke-WebRequest "https://huggingface.co/rhasspy/piper-voices/resolve/main/nl/nl_BE/nathalie/medium/nl_BE-nathalie-medium$ext" -OutFile "$stem\nl_BE-nathalie-medium$ext"
          }
          $p = Start-Process -FilePath nova\dist\NOVA.exe -ArgumentList "--selftest" -Wait -PassThru
          $rapport = Get-Content "$env:APPDATA\NOVA\zelftest.txt"
          $rapport
          if ($p.ExitCode -ne 0) { throw "zelftest faalde (code $($p.ExitCode))" }
          if (-not ($rapport -match "^OK +Nederlandse stem \(Piper\): nl_BE-nathalie-medium")) { throw "de Nederlandse stem (Piper) werkt niet in de exe" }
          if (-not ($rapport -match "^OK +documenten \(pdf, Word\): pdf en word gemaakt en teruggelezen")) { throw "documenten lezen/maken werkt niet in de exe" }
      - name: Proef met venster (opent de ECO-HUD?)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath nova\dist\NOVA.exe -PassThru
          Start-Sleep -Seconds 25
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("nova-venster.png")
          $titels = Get-Process NOVA -ErrorAction SilentlyContinue | ForEach-Object { $_.MainWindowTitle } | Where-Object { $_ }
          "Venster: $($titels -join ', ')"
          $fout = "$env:APPDATA\NOVA\venster-fout.txt"
          Get-Process NOVA -ErrorAction SilentlyContinue | Stop-Process -Force
          if (Test-Path $fout) { Get-Content $fout; throw "de ECO-HUD opende niet (zie hierboven); NOVA viel terug op het eenvoudige venster" }
          if (-not ($titels -match "Nice Operating Variant Agent")) { throw "geen NOVA-venster gevonden" }
      - name: Screenshot bewaren
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nova-venster
          path: nova-venster.png
          if-no-files-found: ignore
      - name: Als download klaarzetten
        if: github.event_name != 'pull_request'  # bij een PR alleen bouwen en testen
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nova-${{ github.run_number }}
          name: NOVA (build ${{ github.run_number }})
          make_latest: "true"
          files: nova/dist/NOVA.exe
          body: |
            NOVA: ECO op je Windows-laptop. Download NOVA.exe en start hem; uitleg in NOVA.md.
            NOVA werkt zichzelf daarna automatisch bij (bij het starten en elke 6 uur).
            Windows kan waarschuwen ("Windows heeft uw pc beschermd") omdat de exe niet ondertekend is: kies "Meer info" → "Toch uitvoeren".
