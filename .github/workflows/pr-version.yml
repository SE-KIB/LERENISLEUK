name: Update PR version badge

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set PR number and time in badge
        run: |
          # Zet rechtsboven in index.html: "PR<nummer> | <datum tijd>" (Nederlandse tijd).
          STAMP="PR${{ github.event.pull_request.number }} | $(TZ=Europe/Amsterdam date '+%d-%m-%Y %H:%M')"
          sed -i -E "s#(<div id=\"version\"[^>]*>)[^<]*#\1${STAMP}#" index.html
          grep -n 'id="version"' index.html

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "Update version badge to PR #${{ github.event.pull_request.number }}"
            git push
          else
            echo "No change needed."
          fi
